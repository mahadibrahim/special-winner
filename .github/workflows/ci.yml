# ── CI: tiered for fast PR iteration ─────────────────────────────────
#
# Pull requests run a FAST GATE — the launch-critical path only:
#   typecheck + build + full API tests + the @critical-tagged E2E specs
#   (registration, payment, auth). Target turnaround ~8 min.
#
# Pushes to main run the FULL E2E SUITE (every spec, sharded) as a
# post-merge check. A regression outside the critical path is caught on
# main minutes after merge instead of gating every PR.
#
# Every DB-touching job spins up its own throwaway Postgres service
# container and migrates + seeds it via the local `setup` composite
# action — so runs are fully independent and never queue behind each
# other (the old model serialized ALL runs through one shared staging
# DB, which is most of where the ~30-min PR turnaround came from).
#
# This is a pre-launch tradeoff: when things reach a steady state, fold
# `test-full` back into the PR gate (or just delete the `@critical`
# split) to restore full-coverage gating on every PR.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Per-ref grouping only. A new push to the same PR branch cancels the
# stale in-flight run; different PRs / branches never block each other.
# Main runs are NOT cancelled (each post-merge run completes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared config + secrets for every job. DATABASE_URL points at the
# per-job Postgres service container (see `services:` blocks below).
env:
  CI: 'true'
  R2_MOCK: '1'
  # Dispatch-layer test mode (src/lib/messaging/mock.ts) — SMS/email sends
  # are recorded in-memory instead of hitting Twilio/Resend, so cron/API
  # tests can assert on channel + recipient + body without firing real
  # outbound messages against the TWILIO_* secrets below. Inspectable via
  # /api/test/messaging-mock, gated the same way as E2E_TEST_ENDPOINTS.
  MESSAGING_MOCK: '1'
  # Disable the auth/OTP rate limiter — the shared CI runner IP trips it
  # across dozens of sign-ins per suite and cascades into timeouts.
  DISABLE_RATE_LIMIT: '1'
  # Enable the /api/test/** fixture endpoints (tenant-scoping suites use
  # them to discover Org B resource IDs). Explicit opt-in, separate from
  # the rate-limit switch so neither can accidentally enable the other.
  E2E_TEST_ENDPOINTS: 'yes'
  # Literal CI value so cron endpoints enforce auth and the dev server +
  # test runner agree on it. Not a real secret.
  CRON_SECRET: ci-cron-test-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aspire_ci
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
  # RESEND_API_KEY is intentionally NOT defined as a repo secret — it resolves
  # to empty here. With MESSAGING_MOCK=1 above, isEmailConfigured() reports
  # true anyway (the mock doesn't need a real key) and sendEmail() records
  # instead of sending, so email is a working-but-mocked channel in CI, not
  # an inert one (feedback dispatch's "unconfigured ⇒ mark sent" fallback in
  # src/lib/feedback/dispatch.ts is unreachable here — sends "succeed" via
  # the mock instead). Do NOT add the secret: CI would then fire real Resend
  # sends at fake @test.* addresses and the hard bounces would damage the
  # sending domain's reputation.
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  RESEND_INBOUND_WEBHOOK_SECRET: ${{ secrets.RESEND_INBOUND_WEBHOOK_SECRET }}
  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
  TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
  TWILIO_WEBHOOK_AUTH_TOKEN: ${{ secrets.TWILIO_WEBHOOK_AUTH_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_CLASSIFIER_MODEL: ${{ secrets.ANTHROPIC_CLASSIFIER_MODEL }}
  MAGIC_LINK_BASE_URL: ${{ secrets.MAGIC_LINK_BASE_URL }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

jobs:
  # ── Fast, no DB ────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Type check
        # Bump Node's heap: the project crossed tsc's default ~2 GB limit and the
        # job started OOMing ("Ineffective mark-compacts near heap limit") on the
        # ubuntu runner, even though the code type-checks clean locally and via build.
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # ── Migration drift gate (fast, no DB) ─────────────────────────────
  # Catches the 0024-class incident: a PR edits src/lib/db/schema/* but
  # forgets to commit the generated migration. `migrate-prod.yml` only
  # applies COMMITTED migrations on merge, so an un-generated schema change
  # ships code against a stale prod schema. `drizzle-kit generate` diffs
  # the schema against the committed migration snapshots offline (no DB
  # connection) — if it produces any new/changed files under the
  # migrations dir, the schema change was never captured. Fail the PR.
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate migrations from schema
        run: npm run db:generate
      - name: Fail if a migration is missing
        run: |
          if [ -n "$(git status --porcelain src/lib/db/migrations)" ]; then
            echo "::error::Schema change detected without a committed migration. Run 'npm run db:generate' locally and commit the generated files under src/lib/db/migrations/."
            git status --porcelain src/lib/db/migrations
            git --no-pager diff -- src/lib/db/migrations
            exit 1
          fi
          echo "No uncommitted migration drift."

  # ── Build ──────────────────────────────────────────────────────────
  # Needs a reachable, migrated DB: prerendered pages (e.g. /guides/*)
  # run real queries at build time (SELECT FROM sports …) and hard-fail
  # on a connection error.
  build:
    # PR + manual only. Post-merge relies on Netlify's own build for the deploy,
    # so re-running build on push is a redundant ~2.5m (CI cost dedup).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database-url: ${{ env.DATABASE_URL }}
      - name: Build
        run: npm run build

  # ── Full API integration tests (PR + manual; post-merge runs test-full) ──
  test-api:
    # PR + manual only — already gates the PR; skip the ~5m re-run on merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Start dev server
        run: |
          npm run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid

      - name: Wait for dev server
        run: npx --yes wait-on http://localhost:4321/api/auth/session --timeout 180000

      - name: Run API tests
        run: npm run test:api
        env:
          TEST_BASE_URL: http://localhost:4321

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev-server.pid ]; then
            kill "$(cat /tmp/dev-server.pid)" || true
          fi

      - name: Upload dev server log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-server-log
          path: /tmp/dev-server.log
          retention-days: 7

  # ── PR gate: launch-critical E2E only (@critical-tagged specs) ──────
  test-critical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run critical E2E tests
        run: npm run test:critical

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-critical
          path: playwright-report/
          retention-days: 7

  # ── Post-merge: full E2E suite, sharded (push to main + manual) ─────
  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aspire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run full E2E suite (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
