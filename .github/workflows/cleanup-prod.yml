# Manual cleanup of polluted catalog rows on the prod DB.
#
# Reason this is a workflow_dispatch (button in the GitHub Actions UI)
# instead of an automatic deploy step:
#   • The cleanup is destructive — DELETE statements with cascade.
#   • It uses an allow-list (only soccer / Worthington / Downtown). If
#     the launch ever expands to more sports or venues, blindly running
#     this on every deploy would wipe legitimate data.
#   • workflow_dispatch lets the operator review the dry-run output
#     in the UI, then re-run with dry_run=false to commit.
#
# Workflow_dispatch UI:
#   Run workflow ▾
#     Branch: main
#     ☐ dry_run     (default: true   — set false to actually delete)
#     ☐ strict      (default: true   — false uses the original deny-list
#                                       script instead, leaving Powell etc.)

name: Cleanup prod catalog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no deletes). Uncheck to commit."
        type: boolean
        default: true
      strict:
        description: "Strict allow-list (only soccer / Worthington / Downtown). Uncheck to use the original deny-list patterns."
        type: boolean
        default: true

concurrency:
  group: cleanup-prod
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production # GitHub gates this on environment-protection rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run cleanup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_PROD_CLEANUP: yes
          DRY_RUN: ${{ inputs.dry_run }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          echo "::notice::dry_run=$DRY_RUN strict=$STRICT"
          if [ "$STRICT" = "true" ]; then
            SCRIPT="prod:cleanup-strict"
          else
            SCRIPT="prod:cleanup"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npm run "$SCRIPT" -- --dry-run
          else
            npm run "$SCRIPT"
          fi
