# Weekly check that staging and prod have the same application schema.
#
# Real schema drift means one of:
#   - Someone ran `db:push` against one DB
#   - Migrations applied successfully on one DB but failed on the other
#     and weren't re-run
#   - Someone made an out-of-band hand edit (ALTER TABLE, etc.)
#   - migrate-staging.yml is failing silently and nobody noticed
#
# When staging drifts, integration tests that "work on staging" can
# ship code that breaks in prod (or vice versa). This cron catches
# drift within a week — far faster than the "stale staging" pain we hit
# when discovering it mid-release.
#
# How: `pg_dump --schema-only` is deterministic across identical
# schemas. Both dumps are passed through
# scripts/normalize-schema-dump.py before diffing — it strips
# server-version formatting noise (staging runs PG18, prod PG17.x, and
# their dumps differ cosmetically) and sorts columns within each
# CREATE TABLE (column ORDER differs where history mixed db:push and
# migrations; it is semantically irrelevant). `diff -u` on the
# normalized dumps either shows nothing (in sync) or the DDL delta
# needed to reconcile.
#
# Excluded:
#   - `drizzle` schema (migration tracking — content differs by row id
#     not by structure; the table presence is what matters and that's
#     guaranteed by both running through db:migrate)
#
# Required secrets: STAGING_DATABASE_URL, DATABASE_URL.

name: Schema drift (staging vs prod)

on:
  schedule:
    # Daily at 12:00 UTC — catch schema drift within a day of it landing
    # rather than letting it sit until the next Monday.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Railway is on Postgres 18.x. The runner image (ubuntu-24.04) ships
      # postgresql-client-16, which aborts with "server version mismatch"
      # against an 18 server. Install pg-client-18 from PGDG AND prepend
      # its bin dir to $GITHUB_PATH — Ubuntu keeps the runner-default
      # pg_dump-16 at /usr/bin/pg_dump otherwise, so apt-installing 18
      # alone leaves `pg_dump` resolving to 16 (that bug ate the first
      # fix in PR #74).
      - name: Install Postgres 18 client (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # Persist for every subsequent step in this job.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump version
        run: |
          which pg_dump
          pg_dump --version
          pg_dump --version | grep -E ' 1[89]\.' \
            || (echo "::error::pg_dump version mismatch — Railway is on PG18+, need pg-client-18+" && exit 1)

      - name: Dump staging schema
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          pg_dump --schema-only --no-owner --no-acl \
            --exclude-schema=drizzle \
            "$STAGING_DATABASE_URL" > staging.sql

      - name: Dump prod schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --schema-only --no-owner --no-acl \
            --exclude-schema=drizzle \
            "$DATABASE_URL" > prod.sql

      - name: Normalize dumps
        run: |
          python3 scripts/normalize-schema-dump.py staging.sql > staging.norm.sql
          python3 scripts/normalize-schema-dump.py prod.sql > prod.norm.sql

      - name: Compare
        id: compare
        run: |
          if diff -u staging.norm.sql prod.norm.sql > drift.patch; then
            echo "✅ Staging and prod schemas are in sync."
            echo "drift=no" >> "$GITHUB_OUTPUT"
            {
              echo "## ✅ Schema in sync"
              echo ""
              echo "Staging and prod schemas match. Nothing to reconcile."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Schema drift detected between staging and prod."
            echo "::error::Schema drift detected — see drift.patch artifact for the diff."
            echo "drift=yes" >> "$GITHUB_OUTPUT"
            echo "--- Diff (truncated to 200 lines) ---"
            head -n 200 drift.patch
            exit 1
          fi

      # Write a human-readable summary to the GHA run page when drift exists.
      # `if: failure()` runs only on the drift-detected path (Compare's `exit 1`).
      # Output appears in the run's "Summary" tab — no need to download
      # drift.patch to see the high-level shape.
      - name: Drift summary (GitHub UI)
        if: failure() && hashFiles('drift.patch') != ''
        run: |
          # Skip the first two header lines (--- staging.sql / +++ prod.sql)
          # so they don't get counted as content.
          body=$(tail -n +3 drift.patch)
          added=$(printf '%s\n' "$body" | grep -cE '^\+[^+]' || true)
          removed=$(printf '%s\n' "$body" | grep -cE '^-[^-]' || true)

          {
            echo "## ❌ Schema drift detected"
            echo ""
            echo "| Lines only in **prod** | Lines only in **staging** |"
            echo "|---|---|"
            echo "| $added | $removed |"
            echo ""
            echo "### Tables present in **prod** but missing from staging"
            in_prod=$(grep -E '^\+-- Name: [a-zA-Z0-9_]+; Type: TABLE' drift.patch \
              | sed -E 's/^\+-- Name: ([a-zA-Z0-9_]+); Type: TABLE.*/- `\1`/' \
              | sort -u)
            if [ -n "$in_prod" ]; then echo "$in_prod"; else echo "_(none)_"; fi
            echo ""
            echo "### Tables present in **staging** but missing from prod"
            in_staging=$(grep -E '^--- Name: [a-zA-Z0-9_]+; Type: TABLE' drift.patch \
              | sed -E 's/^--- Name: ([a-zA-Z0-9_]+); Type: TABLE.*/- `\1`/' \
              | sort -u)
            if [ -n "$in_staging" ]; then echo "$in_staging"; else echo "_(none)_"; fi
            echo ""
            echo "### Postgres server versions"
            echo '```'
            # Version headers are stripped from the normalized dumps —
            # read them from the raw ones instead.
            grep -E '^-- Dumped from database version' staging.sql | sed 's/^/staging: /' || true
            grep -E '^-- Dumped from database version' prod.sql | sed 's/^/prod:    /' || true
            echo '```'
            echo ""
            echo "### Next steps"
            echo "1. Fire **Migrate staging database** via \`workflow_dispatch\` from the Actions tab to apply any unmerged migrations to staging."
            echo "2. If \`db:migrate\` fails with \"already exists\" errors, the staging DB has out-of-band schema changes — review the drift.patch artifact and reconcile manually."
            echo "3. Re-run this workflow. Expect a green ✅ summary."
            echo ""
            echo "Full DDL diff is in the **schema-drift-patch** artifact attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift patch on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-patch
          path: |
            drift.patch
            staging.sql
            prod.sql
          retention-days: 30
