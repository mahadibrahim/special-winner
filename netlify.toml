[build]
  command = "npm run build"
  publish = "dist"

# User-authored functions (e.g. scheduled tasks) live alongside the
# adapter-generated ones. Astro's @astrojs/netlify adapter writes its
# functions into .netlify/functions-internal at build time; this
# declaration adds a second source directory for our own scheduled
# tasks (see netlify/functions/scheduled-*.ts).
[functions]
  directory = "netlify/functions"

  # ============================================================
  # DEPLOY MODEL (updated 2026-05-14)
  # ============================================================
  # Two Netlify sites build from this repo, both git-connected to
  # `main`:
  #   • aspire-sports-staging — STAGING_DATABASE_URL + Stripe test mode.
  #   • production site       — DATABASE_URL (prod) + Stripe live mode.
  #
  # Each one auto-publishes CODE on every push to `main`. Neither runs
  # database migrations as part of its build — that is handled
  # out-of-band by .github/workflows/migrate-prod.yml, which runs the
  # committed Drizzle migrations against prod on the same trigger
  # (every push to `main`). So code and schema stay in sync.
  #
  # (An earlier comment here claimed the production site was
  # disconnected from git auto-deploy and shipped only via a tagged
  # workflow. That was never actually true — the site stayed
  # git-connected, the tagged workflow stopped firing, and migrations
  # silently stopped running. The model above is the corrected reality.)
  #
  # Hardening follow-up: prepend `npm run db:migrate` to the build
  # command below so migrate→build→deploy is one atomic process and a
  # failed migration blocks the code deploy. Requires DATABASE_URL in
  # each site's Netlify build env first.
  #
  # Branch deploys + deploy previews are intentionally gated (see
  # contexts below) so we don't burn credits on feature-branch builds —
  # this is why the per-PR Netlify checks "fail" in ~12s.
  # ============================================================

# Stop automatic deploys - we deploy manually via CI on releases
[build.processing]
  skip_processing = false

# ============================================================
# STATIC ASSET CACHING
# ============================================================
# Astro emits content-hashed bundles under /_astro/ — a changed file
# gets a new URL, so these are safe to cache forever. Without this,
# Netlify serves them with max-age=0 + etag revalidation, costing a
# round-trip per asset per page view.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hand-managed assets in /public are NOT content-hashed (same URL after
# a redeploy), so cap browser cache at a day instead of immutable.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ============================================================
# SECURITY HEADERS
# ============================================================
# Applied to every response. The two enforced headers are zero-risk
# hardening. The CSP is intentionally REPORT-ONLY: it never blocks a
# request, so it cannot break the site — it surfaces violations (in the
# browser console / a future report-uri) so the policy can be tightened
# and promoted to an enforcing `Content-Security-Policy` once the real
# source list is confirmed. Tighten `img-src`/`connect-src` and flip the
# header name to enforce as a follow-up.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://challenges.cloudflare.com https://upload-widget.cloudinary.com; connect-src 'self' https://api.stripe.com https://*.google-analytics.com https://*.googletagmanager.com https://api.cloudinary.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com https://upload-widget.cloudinary.com"

# ============================================================
# POSTHOG REVERSE PROXY
# ============================================================
# Serve PostHog ingestion first-party through /ingest/* so content/tracker
# blockers (which blocklist *.i.posthog.com) can't silently drop analytics,
# session replay, and error events. The client points api_host at /ingest on
# deployed hosts (src/components/posthog.astro). Applies to every domain this
# build serves, gosoccerone.com included.
#
# Order matters — Netlify uses first-match, so the asset paths must precede
# the catch-all. Static bundles AND remote-config /array/* are served by the
# assets origin (us-assets); everything else by the ingestion origin (us).
# US cloud; status 200 + force = proxy (rewrite), not a 30x redirect.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[context.production]
  command = "npm run build"

# Disable branch deploys to save credits
[context.branch-deploy]
  command = "echo 'Branch deploys disabled' && exit 1"

# Disable deploy previews to save credits
[context.deploy-preview]
  command = "echo 'Deploy previews disabled' && exit 1"
