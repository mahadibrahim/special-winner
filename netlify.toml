[build]
  command = "npm run build"
  publish = "dist"

# User-authored functions (e.g. scheduled tasks) live alongside the
# adapter-generated ones. Astro's @astrojs/netlify adapter writes its
# functions into .netlify/functions-internal at build time; this
# declaration adds a second source directory for our own scheduled
# tasks (see netlify/functions/scheduled-*.ts).
[functions]
  directory = "netlify/functions"

  # ============================================================
  # DEPLOY MODEL (2026-05-03)
  # ============================================================
  # Two Netlify sites build from this repo:
  #   • aspire-sports-staging — auto-deploys every push to main.
  #     Points at STAGING_DATABASE_URL + Stripe test mode.
  #   • production site — disconnected from Git auto-deploy in the
  #     Netlify dashboard. Deploys only via .github/workflows/deploy.yml
  #     on v* tags, against DATABASE_URL (prod) + Stripe live mode.
  #
  # Branch deploys + deploy previews are still gated (see contexts
  # below) so we don't burn credits on feature-branch builds.
  # ============================================================

# Stop automatic deploys - we deploy manually via CI on releases
[build.processing]
  skip_processing = false

[context.production]
  command = "npm run build"

# Disable branch deploys to save credits
[context.branch-deploy]
  command = "echo 'Branch deploys disabled' && exit 1"

# Disable deploy previews to save credits
[context.deploy-preview]
  command = "echo 'Deploy previews disabled' && exit 1"
