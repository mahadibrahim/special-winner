id: chk.parking_setup
kind: checklist
status: stub
items:
  - id: traffic_flow_marked
    label: Cones/ropes placed to mark traffic flow
  - id: signage_placed
    label: Directional and reserved-row signage placed
  - id: entry_staffed
    label: Entry point staffed if attended parking
  - id: overflow_route_clear
    label: Overflow route walked and confirmed clear
