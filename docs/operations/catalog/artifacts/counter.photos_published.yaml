id: counter.photos_published
kind: counter
status: stub
description: |
  Increments once per media asset whose parent shoot session is
  transitioned to published status in the admin media console. Team/
  wide media publishes by default (adults opt-out, kids opt-in but
  default-publish for team/wide shots), gated operationally by the
  event's do-not-publish shortlist and backstopped by the platform's
  automated consent check against registration/roster records. Used as
  the day's published-volume figure and to confirm families have
  photos available to view.
