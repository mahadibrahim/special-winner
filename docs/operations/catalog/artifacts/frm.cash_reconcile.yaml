id: frm.cash_reconcile
kind: form
status: stub
fields:
  - id: reconciled_by
    label: Reconciled by
    type: text
    required: true
  - id: pos_card_sales
    label: Card sales per POS Z-report (all sales — concessions are card-only)
    type: number
    required: true
  - id: units_sold_by_item
    label: Units sold by item (closing inventory vs. opening count)
    type: long_text
    required: true
  - id: expected_revenue
    label: Expected revenue (units sold x price)
    type: number
    required: true
  - id: variance
    label: Variance (expected revenue vs. POS card sales), over or short
    type: number
    required: true
  - id: variance_within_tolerance
    label: Variance within normal tolerance?
    type: boolean
    required: true
  - id: recount_performed
    label: Inventory recount performed (if outside tolerance)?
    type: boolean
    required: false
  - id: variance_explanation
    label: Explanation if outside tolerance after recount
    type: long_text
    required: false
  - id: escalated_to
    label: Escalated to (venue manager / director) if applicable
    type: text
    required: false
