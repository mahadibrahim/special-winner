id: counter.walk_on_registrations
kind: counter
status: stub
description: |
  Increments once per completed walk-on registration through the venue
  command center's walk-in flow (/admin/venue) — player/registrant info
  captured, waiver signed, payment completed by the guest via pay link
  or kiosk, and the player added to the session roster. Used at
  end-of-day reconciliation to tie walk-on counts to concession/session
  revenue and to today's attendance numbers.
