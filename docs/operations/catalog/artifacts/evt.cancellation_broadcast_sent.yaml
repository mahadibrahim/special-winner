id: evt.cancellation_broadcast_sent
kind: system_event
status: stub
description: |
  Fires when the cancellation/delay broadcast completes for a rainout
  decision marked cancel or delay. Records the send timestamp,
  recipient count, and channel breakdown (push, SMS, email, Telegram)
  across parents, coaches, refs, and captains, and is checked against
  the rainout decision timestamp to confirm the broadcast went out
  promptly after the call was made.
