id: frm.weekly_safety_review
kind: form
status: stub
fields:
  - id: week_of
    label: Week of
    type: date
    required: true
  - id: incidents_reviewed_count
    label: Incidents reviewed
    type: number
    required: true
  - id: themes_identified
    label: Themes identified across the week's incidents
    type: long_text
    required: true
  - id: near_misses_noted
    label: Near-misses / close calls noted
    type: long_text
    required: false
  - id: field_damage_patterns
    label: Field damage patterns observed
    type: long_text
    required: false
  - id: decisions
    label: Decisions made
    type: long_text
    required: true
  - id: facility_or_policy_changes
    label: Facility or policy changes required
    type: long_text
    required: false
  - id: venue_manager_consulted
    label: Venue manager consulted?
    type: boolean
    required: true
  - id: prior_week_items_status
    label: Status of prior week's open items
    type: long_text
    required: false
  - id: signed_by
    label: Signed by
    type: text
    required: true
