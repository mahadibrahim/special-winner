id: evt.score_posted
kind: system_event
status: stub
description: |
  Fires when a match's final score (submitted via the referee's match
  report) sets the game to completed, making that result available to
  every standings view (the public league standings pages, dashboard
  standings) the next time each is loaded. Recorded per match; used to
  confirm a specific match's result actually landed if a parent, coach,
  or team captain asks whether it "counted yet."
