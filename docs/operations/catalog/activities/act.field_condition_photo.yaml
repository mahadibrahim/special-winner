id: act.field_condition_photo
name: Field condition photo (pregame)
description: |
  Capture a date-stamped photo of each playing surface immediately
  before the first match of the day so any later damage claim has a
  baseline. Particularly important on outdoor turf and natural grass.
trigger: ~30 minutes before first kickoff on each surface
phase: pre_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.venue_manager
  responsible: [role.venue_manager]
  consulted: []
  informed: [role.facilities, role.director]
automation_status: manual
platform_features:
  - feat.photo_upload_capture
  - feat.activity_tracking_engine
escalation_path: |
  If venue_manager unreachable, role.facilities captures the photo and
  escalates to role.director per the Coach → Venue Manager → Director
  handoff ladder.
sop_body: |
  1. About 30 minutes before the first match on each surface, walk to
     that surface with a phone or camera.
  2. Frame a wide shot showing the full playing surface — turf/grass
     condition, lines, and goals or nets in position.
  3. Take the photo with location and timestamp on so it's date-stamped
     automatically.
  4. Upload it to the day's match record under that surface before the
     first whistle.
  5. Repeat for every surface hosting a match that day — one dated photo
     per surface, before its first kickoff.
  6. If the photo reveals a condition issue (standing water, divots,
     damaged line paint), flag it to facilities right away rather than
     waiting for the field damage process.
  7. Don't skip this even on a clear day — it's the baseline any later
     damage claim gets measured against.
tools:
  - Camera or phone with location/timestamp on
  - The day's surface list (which fields/courts host a match today)
tracking_method: photo_upload
tracking_artifact:
  media_kind: field_condition_pregame
  min_count: 1
expected_completion: T-30min
