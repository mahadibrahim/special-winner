id: act.facility_lock_alarm
name: Facility lock and alarm
description: |
  Power down equipment and HVAC, lock interior and exterior doors, set
  the alarm, and confirm the perimeter is secure. Applies to owned
  venues where Aspire is responsible for closing.
trigger: After the close walkthrough is signed off
phase: end_of_day
sport_tags: []
venue_tags: [owned]
format_tags: []
audience_tags: []
raci:
  accountable: role.venue_manager
  responsible: [role.venue_manager]
  consulted: []
  informed: [role.director]
automation_status: manual
platform_features:
  - feat.checklist_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If venue_manager unreachable, escalate to role.director per the Coach → Venue Manager →
  Director handoff ladder; alarm code rotation policy is enforced
  centrally.
sop_body: |
  1. Confirm the close walkthrough is signed off before starting —
     lock-up never happens first.
  2. Power down field/court lighting, scoreboards, and any powered
     equipment not needed overnight.
  3. Set HVAC to its overnight/unoccupied setting.
  4. Walk back through and lock all interior doors: locker rooms,
     storage/equipment room, concessions, office.
  5. Confirm interior lights are off except any required security
     lighting.
  6. Lock all exterior doors, confirming each is fully secured (not just
     latched).
  7. Set the alarm with the current code and wait for the confirmation
     tone or light before you leave — don't assume it armed.
  8. Confirm the perimeter is secure (gates latched, no propped doors) on
     your way to your vehicle.
  9. Log the lock-and-alarm completion. Alarm code rotation follows the
     centrally-enforced policy — never share or write down the code.
tools:
  - Alarm keypad and the current code
  - Building key ring
  - HVAC and lighting panel
tracking_method: checklist
tracking_artifact:
  template_id: chk.facility_lock_alarm
expected_completion: phase_end
