id: act.field_reset_between_matches
name: Field reset between matches
description: |
  Sweep, re-line if needed, replace any displaced markers, and confirm
  the playing surface is ready for the next match. Includes rapid trash
  pickup along sidelines.
trigger: Final whistle of each match
phase: post_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.facilities
  responsible: [role.facilities]
  consulted: []
  informed: [role.event_lead, role.venue_manager, role.ref]
automation_status: manual
platform_features:
  - feat.checklist_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If facilities unreachable, escalate to role.venue_manager per the Coach →
  Venue Manager → Director handoff ladder.
sop_body: |
  1. At the final whistle, do a rapid trash pickup along the sidelines
     and benches before the next teams arrive.
  2. Sweep the playing surface for debris, displaced equipment, and any
     personal items (route items to lost and found).
  3. Check field markings/lines and re-line or touch up any that shifted
     or faded during the match.
  4. Replace any displaced markers — corner flags, cone lines, boundary
     markers — to their correct position.
  5. Confirm benches and team areas are clear and ready for the next
     teams.
  6. Confirm the surface meets the same safety standard as the pregame
     field/court setup — no new hazards introduced during play.
  7. Complete within the 15-minute turnover window so the next match
     isn't delayed.
tools:
  - Trash bags and a pickup bucket for rapid sideline sweep
  - Field-marking paint or chalk (line touch-ups)
  - Corner flags and boundary markers
tracking_method: checklist
tracking_artifact:
  template_id: chk.field_reset
expected_completion: T+15min
