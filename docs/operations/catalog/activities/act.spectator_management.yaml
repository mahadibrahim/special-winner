id: act.spectator_management
name: Spectator management
description: |
  Front of house handles spectator complaints, seat conflicts, lost
  parents, and general sideline behavior issues during the event.
  Captures complaint details for follow-up and trend tracking.
trigger: Spectator complaint or sideline issue raised during a match
phase: in_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.front_of_house
  responsible: [role.front_of_house]
  consulted: [role.event_lead]
  informed: [role.venue_manager]
automation_status: manual
platform_features:
  - feat.form_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If issue exceeds front_of_house scope, escalate to role.event_lead;
  any safety-relevant escalation goes to role.venue_manager.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: form
tracking_artifact:
  template_id: frm.spectator_complaint
expected_completion: trigger+5min
