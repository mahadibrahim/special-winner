id: act.walk_on_registration
name: Walk-on registration
description: |
  Register a day-of walk-on for a drop-in session or clinic through the
  venue command center: open the session, tap an open slot, and run the
  walk-in flow. The guest signs the waiver and pays from their own phone
  (a text or email pay link) or at the kiosk — never cash or card at the
  desk. The slot holds for 2 hours; if it isn't paid by then, one
  reminder goes out before the hold releases and the slot returns to the
  schedule. Each completed walk-on increments the day's counter for
  revenue reconciliation.
trigger: Throughout the drop-in/clinic intake window
phase: pre_game
sport_tags: []
venue_tags: []
format_tags: [drop_in, clinic]
audience_tags: []
raci:
  accountable: role.front_of_house
  responsible: [role.front_of_house]
  consulted: []
  informed: [role.event_lead, role.venue_manager]
automation_status: hybrid
platform_features:
  - feat.counter_service
  - feat.activity_tracking_engine
escalation_path: |
  If front_of_house unreachable, escalate directly to role.venue_manager
  per the Coach → Venue Manager → Director handoff ladder.
sop_body: |
  1. Throughout the drop-in/clinic intake window, greet each walk-on
     parent or adult player at the front desk — the coach running the
     session isn't the one who registers walk-ons.
  2. On the venue command center board, find the session they're joining
     and open it to reach its roster panel.
  3. Tap an open slot to start the walk-in flow.
  4. Step 1, who's playing: enter the player's name. For a minor, also
     collect the parent's name and the parent's contact info; for an
     adult, collect their own contact info.
  5. Step 2, waiver: choose how they'll sign — right now on the desk
     device, or by a text link they sign from their own phone.
  6. Step 3, how they'll finish signing up: choose to text or email them
     a pay link, or hand them off to the kiosk to self-pay. There's no
     cash or card-at-desk option — the guest completes payment on their
     own device or the kiosk, not through you.
  7. Submitting creates the booking. For the link option, it sends
     automatically — if the send fails, share the link shown on screen
     by hand instead. Either way, the guest can sign the waiver, add a
     photo, and pay right from their phone.
  8. The slot holds for 2 hours from creation. If it isn't paid by then,
     the system sends one reminder before the hold expires and the slot
     releases back to the schedule for the next walk-on or the waitlist.
  9. While the hold is open, the roster panel shows the row as "awaiting
     payment" with Resend pay link and Cancel hold actions — use Resend
     if the guest says they never got it, or Cancel hold to free the
     slot right away if they change their mind.
  10. Once paid, the row clears to a normal confirmed booking and the
      walk-on counter increments automatically. Check the player in from
      the same roster panel when they arrive to play.
  11. As you send the player over, tell the coach in person anything the
      parent mentioned that the coach should know — a medical condition,
      an allergy, a first-timer. The walk-in form has no field for this;
      it's a word-of-mouth handoff, so don't skip it.
  12. If the session is already full, the roster panel won't offer an
      open slot to register into — tell the guest to check back for a
      later session or join the waitlist through registration.
  13. Open slots aren't the only limit — if walk-on volume would push a
      session past its coach-to-player ratio, the coach can close intake
      for that session even with slots showing open. Hold additional
      walk-ons for the next available session rather than overloading
      the group.
tools:
  - The venue command center (/admin/venue) — roster panel and walk-in flow
  - The desk device or the guest's own phone (waiver signature, photo, payment)
  - The kiosk self-pay station (optional hand-off)
tracking_method: counter_increment
tracking_artifact:
  counter: counter.walk_on_registrations
  min_count: 0
expected_completion: T-15min
