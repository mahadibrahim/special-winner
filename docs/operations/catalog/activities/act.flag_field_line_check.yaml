id: act.flag_field_line_check
name: Flag football field line check
description: |
  Walk the outdoor flag football field, verify yard lines, end zones,
  and sideline markings are visible and accurate, and capture a photo
  for the match record. Specific to outdoor flag football matches.
trigger: ~30 minutes before each flag football kickoff
phase: pre_game
sport_tags: [outdoor:flag_football]
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.facilities
  responsible: [role.facilities]
  consulted: []
  informed: [role.venue_manager, role.ref]
automation_status: manual
platform_features:
  - feat.photo_upload_capture
  - feat.activity_tracking_engine
escalation_path: |
  If facilities unreachable, escalate to role.venue_manager per the Coach → Venue Manager →
  Director handoff ladder.
sop_body: |
  1. About 30 minutes before each flag football kickoff, walk the full
     length of the field.
  2. Verify yard lines are visible and accurately spaced per the field's
     marking standard.
  3. Verify both end zones are clearly marked at the correct depth.
  4. Verify sideline and out-of-bounds markings are visible along the
     full length of the field.
  5. Check flag-pulling zone markings if the format uses them, and
     confirm no line has faded or shifted since the last match.
  6. Touch up or re-mark anything faded or unclear before the match
     starts — don't let players guess at boundaries.
  7. Photograph the field lines and upload the photo to the match record.
  8. If field conditions (mud, standing water) are obscuring lines faster
     than they can be maintained, flag it to the venue manager — this may
     factor into a rainout call.
tools:
  - Field-marking paint or chalk
  - Measuring wheel or tape (yard-line spacing)
  - Camera or phone (photo upload of the field lines)
tracking_method: photo_upload
tracking_artifact:
  media_kind: flag_lines
  min_count: 1
expected_completion: T-30min
