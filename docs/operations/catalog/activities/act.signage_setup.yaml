id: act.signage_setup
name: Signage setup
description: |
  Place wayfinding signs, sponsor banners, field-of-play markers, and
  safety placards in their assigned positions; capture a photo to
  confirm placement.
trigger: ~90 minutes before first kickoff
phase: day_setup
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.facilities
  responsible: [role.facilities]
  consulted: []
  informed: [role.venue_manager]
automation_status: manual
platform_features:
  - feat.photo_upload_capture
  - feat.activity_tracking_engine
escalation_path: |
  If facilities unreachable, escalate to role.venue_manager per the Coach →
  Venue Manager → Director handoff ladder.
sop_body: |
  1. About 90 minutes before first kickoff, pull the day's signage plan
     (wayfinding, sponsor banners, field-of-play markers, safety
     placards).
  2. Place wayfinding signage at entrances, restrooms, and any surface
     families need to find.
  3. Hang sponsor banners in their assigned locations per the
     sponsorship agreement, if any.
  4. Place field-of-play markers (out-of-bounds, spectator line) so
     spectators know where they can and can't stand.
  5. Place safety placards (first-aid location, emergency exit, no pets,
     etc.) wherever required.
  6. Walk the completed layout and photograph each signage zone to
     confirm placement.
  7. Upload the photos to the day's record; pull a replacement from
     backup stock or flag the venue manager for anything missing or
     damaged.
tools:
  - The day's signage plan
  - Wayfinding signs, sponsor banners, and safety placards
  - Camera or phone (photo upload confirming placement)
tracking_method: photo_upload
tracking_artifact:
  media_kind: signage_setup
  min_count: 1
expected_completion: T-90min
