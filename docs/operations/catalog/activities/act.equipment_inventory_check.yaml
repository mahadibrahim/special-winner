id: act.equipment_inventory_check
name: Equipment inventory check
description: |
  Walk the storage area and verify the equipment manifest against on-hand
  stock (balls, cones, pinnies, jerseys, first-aid restock, scoreboards,
  whistles). Surface shortages early so they can be ordered or borrowed
  before the event.
trigger: 48h before event window
phase: pre_day
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.facilities
  responsible: [role.facilities]
  consulted: []
  informed: [role.venue_manager]
automation_status: manual
platform_features:
  - feat.checklist_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If facilities unreachable, escalate to role.venue_manager per the Coach → Venue Manager →
  Director handoff ladder.
sop_body: |
  1. 48 hours before the event window, walk the storage area with the
     equipment manifest in hand.
  2. Count balls by sport and size against the manifest (age-appropriate
     sizes per program).
  3. Count cones, pinnies/scrimmage vests, and portable goals or nets
     against the manifest.
  4. Count jerseys if venue-supplied, plus scoreboards, whistles, and
     clipboards.
  5. Check first-aid restock supply (bandages, tape, ice packs) against
     par for the upcoming event — separate from the field kits checked
     day-of.
  6. Note any shortage or damaged item found during the count.
  7. Order or arrange a borrow from another venue for anything short,
     with enough lead time to arrive before the event; flag to the venue
     manager if a shortage can't be resolved in time.
  8. Log the completed count so equipment storage has a clean baseline to
     compare against after the event.
tools:
  - The equipment manifest (printed or clipboard checklist)
  - Storage area shelving and labels
  - First-aid restock supply log
tracking_method: checklist
tracking_artifact:
  template_id: chk.equipment_inventory
expected_completion: T-48h
