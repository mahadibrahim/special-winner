id: act.incident_followup
name: Incident follow-up
description: |
  Within 48 hours of a logged incident, venue manager follows up with
  the affected party, captures status (recovery, return-to-play,
  insurance contact), and records what additional action, if any, the
  office should take.
trigger: T+24h to T+48h after incident report finalization
phase: post_day
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.venue_manager
  responsible: [role.venue_manager]
  consulted: [role.director]
  informed: [role.parent, role.coach]
automation_status: manual
platform_features:
  - feat.form_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If venue_manager unreachable, role.event_lead conducts follow-up
  outreach and escalates to role.director per the standard handoff
  ladder.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: form
tracking_artifact:
  template_id: frm.incident_followup
expected_completion: T+48h
