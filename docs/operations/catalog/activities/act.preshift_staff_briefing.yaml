id: act.preshift_staff_briefing
name: Pre-shift staff check (optional)
description: |
  A lightweight, optional check-in with on-shift staff before first
  kickoff — a quick radio or in-person round when there's something
  worth flagging, not a mandatory meeting everyone has to gather for.
  The venue manager decides whether to run it at all.
trigger: ~60 minutes before first kickoff, at the venue manager's discretion
phase: day_setup
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.venue_manager
  responsible: [role.venue_manager]
  consulted: []
  informed: [role.event_lead, role.facilities, role.front_of_house, role.photographer]
automation_status: manual
platform_features:
  - feat.form_renderer
  - feat.activity_tracking_engine
escalation_path: |
  This activity is optional and has no hard failure mode. If the venue
  manager wants it run and can't do it themselves, role.event_lead
  covers it per the Coach → Venue Manager → Director handoff ladder.
sop_body: |
  1. This check is optional. Run it when there's something worth
     flagging — a schedule surprise, VIP guests, a weather watch, a
     finding from the opening walkthrough, a staffing swap from the
     schedule confirm. Skip it entirely on a routine day with nothing
     new to share.
  2. If you're running it, keep it to a quick radio or in-person round
     with on-shift staff — event leads, facilities, front of house,
     photographer — not a scheduled meeting everyone has to gather in
     one spot for.
  3. Cover only what's actually changed or worth flagging; don't
     restate the full day's schedule if nothing about it is unusual.
  4. There's no sign-in sheet — this isn't a tracked briefing everyone
     attests to. Log whether you ran it and what you flagged, if
     anything, on the pre-shift staff check form.
  5. If the venue manager decides to run it and can't do so themselves,
     the event lead covers it.
tools:
  - Today's staffing plan and match schedule (reference, if running the check)
  - Opening walkthrough findings (reference, if running the check)
  - Two-way radio (quick round instead of a gather-everyone meeting)
tracking_method: form
tracking_artifact:
  template_id: frm.preshift_staff_check
expected_completion: T-60min
