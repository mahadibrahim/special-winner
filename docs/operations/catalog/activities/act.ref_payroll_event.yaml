id: act.ref_payroll_event
name: Ref payroll event (1099 stipend)
description: |
  Platform hands the day's referee stipend log to the payroll system
  and listens for the contractor stipend payout receipt so each ref's
  pay record is closed for the period.
trigger: T+24h after the ref stipend log is signed off
phase: post_day
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.platform
  responsible: [role.platform]
  consulted: []
  informed: [role.director, role.event_lead]
automation_status: platform
platform_features:
  - feat.payroll_integration
  - feat.external_ack_listener
  - feat.activity_tracking_engine
escalation_path: |
  If payroll handoff fails, on-call platform engineer escalates to
  role.director; ref stipend manually disbursed as fallback.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: external_acknowledgment
tracking_artifact:
  external_system: payroll
  record_kind: contractor_stipend_receipt
expected_completion: T+24h
