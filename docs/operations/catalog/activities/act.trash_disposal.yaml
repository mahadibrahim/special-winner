id: act.trash_disposal
name: Trash disposal
description: |
  Pull all interior and sideline trash bags, walk to the dumpster,
  replace liners, and confirm the disposal area is locked. Applies at
  owned venues where Aspire is responsible for waste handling.
trigger: After last match concludes (owned venues)
phase: end_of_day
sport_tags: []
venue_tags: [owned]
format_tags: []
audience_tags: []
raci:
  accountable: role.facilities
  responsible: [role.facilities]
  consulted: []
  informed: [role.venue_manager]
automation_status: manual
platform_features:
  - feat.checklist_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If facilities unreachable, escalate to role.venue_manager per the
  standard handoff ladder.
sop_body: |
  1. After the last match concludes at an owned venue, pull all interior
     trash bags — restrooms, concessions, locker rooms, office.
  2. Pull all sideline and spectator-area trash bags and any recycling.
  3. Walk bags to the dumpster/disposal area; don't leave bagged trash
     staged inside overnight.
  4. Replace liners in every bin you emptied.
  5. Break down and dispose of any cardboard or bulk packaging from the
     day (concession deliveries, equipment boxes).
  6. Confirm the dumpster/disposal area lid or gate is closed and locked
     after use.
  7. Note any overflow issue (dumpster full, missed pickup) and flag it
     to the venue manager so the hauler can be contacted before the next
     event.
tools:
  - Trash bags and replacement liners
  - Dumpster/disposal area key or access code
  - Recycling bins
tracking_method: checklist
tracking_artifact:
  template_id: chk.trash_disposal
expected_completion: phase_end
