id: act.photo_handoff
name: Photo handoff (raw upload)
description: |
  Photographer uploads the day's raw photos to the media platform so the
  tagging team can begin processing. Each upload increments the day's
  counter for media-volume reporting.
trigger: After photographer's last match of the day
phase: post_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.photographer
  responsible: [role.photographer]
  consulted: []
  informed: [role.event_lead, role.venue_manager]
automation_status: hybrid
platform_features:
  - feat.media_tagger_handoff
  - feat.counter_service
  - feat.activity_tracking_engine
escalation_path: |
  If upload fails, photographer notifies role.event_lead who escalates
  to role.director; raw cards are retained until upload succeeds.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: counter_increment
tracking_artifact:
  counter: counter.photos_uploaded
  min_count: 0
expected_completion: T+30min
