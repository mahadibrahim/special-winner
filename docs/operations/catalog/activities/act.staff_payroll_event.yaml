id: act.staff_payroll_event
name: Staff payroll event (W-2 payout)
description: |
  Platform hands the day's W-2 staff hours and any tips/bonuses to the
  payroll system and listens for the payout receipt acknowledgment so
  the labor record is closed.
trigger: T+24h after staff clock-out signatures are recorded
phase: post_day
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.platform
  responsible: [role.platform]
  consulted: []
  informed: [role.director, role.venue_manager]
automation_status: platform
platform_features:
  - feat.payroll_integration
  - feat.external_ack_listener
  - feat.activity_tracking_engine
escalation_path: |
  If payroll handoff fails, on-call platform engineer escalates to
  role.director; manual payroll batch entered as fallback.
sop_body: |
  1. At T+24h after staff clock-out signatures are recorded for the
     day, the platform compiles the day's W-2 staff hours (and any
     tips or bonuses noted at clock-out) into the payroll export for
     the pay period.
  2. As with the ref stipend handoff, there's no live payroll API
     connection today — this export is a data handoff the office (the
     director or a payroll admin) pulls into the org's actual W-2
     payroll provider, not an automatic disbursement.
  3. Once payroll confirms the payout ran, that confirmation is
     recorded back against this event — currently a manual entry,
     since the automatic ack listener isn't built yet.
  4. This closes the labor record for the pay period once recorded; no
     further action is needed on a normal cycle beyond the manual
     confirmation.
  5. Verification: the director or venue manager can check that every
     staff member who clocked out that day shows a closed pay record
     within a day or two; hours sitting unrecorded past that window
     mean the export step didn't happen.
  6. If the handoff fails or is missed, the on-call platform engineer
     escalates per the escalation path, and a manual payroll batch is
     entered as fallback so staff pay isn't delayed by a platform gap.
  7. Whoever enters the manual batch should still record it in the
     platform once done, so the labor record reflects reality.
tracking_method: external_acknowledgment
tracking_artifact:
  external_system: payroll
  record_kind: w2_payout_receipt
expected_completion: T+24h
