id: act.score_reporting_final
name: Final score attestation
description: |
  At the final whistle the lead referee attests the official score with
  a signature. This signed record is what posts to standings and is
  treated as authoritative for disputes.
trigger: Final whistle of each match
phase: in_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.ref
  responsible: [role.ref]
  consulted: []
  informed: [role.event_lead, role.coach, role.team_captain]
automation_status: hybrid
platform_features:
  - feat.score_attestation
  - feat.signature_capture
  - feat.activity_tracking_engine
escalation_path: |
  If ref unable to sign, event_lead captures a co-attestation with the
  ref's verbal confirmation and escalates to role.venue_manager for
  any contested score.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: signature
tracking_artifact:
  template_id: sig.ref_score_attestation
  required_role: role.ref
expected_completion: phase_end
