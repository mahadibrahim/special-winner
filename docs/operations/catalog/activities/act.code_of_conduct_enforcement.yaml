id: act.code_of_conduct_enforcement
name: Code of conduct enforcement
description: |
  Document and enforce conduct violations during a match — coach
  warnings, parent removals, sideline restrictions — that fall short of
  a formal ejection. The form captures who, what, when, and the action
  taken so the office can follow up.
trigger: Conduct issue observed or reported during the match
phase: in_game
sport_tags: []
venue_tags: []
format_tags: []
audience_tags: []
raci:
  accountable: role.event_lead
  responsible: [role.event_lead]
  consulted: [role.venue_manager]
  informed: [role.director, role.coach]
automation_status: manual
platform_features:
  - feat.form_renderer
  - feat.activity_tracking_engine
escalation_path: |
  If event_lead unreachable, escalate to role.venue_manager; for any
  threatened violence escalate immediately to role.director and law
  enforcement as appropriate.
sop_body: |
  Procedure to be authored by the operating team. This activity is defined
  in the catalog; full step-by-step SOP content will be added in a
  follow-up PR.
tracking_method: form
tracking_artifact:
  template_id: frm.code_of_conduct_event
expected_completion: trigger+5min
