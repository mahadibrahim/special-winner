id: act.equipment_turnover
name: Equipment turnover (between matches)
description: |
  Collect match-specific equipment from the finished match, sanitize as
  needed, and confirm it's ready for the next match in the queue. Goals
  re-secured, scoreboards reset, balls and pinnies counted.
trigger: Final whistle of each match
phase: post_game
