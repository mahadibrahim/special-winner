# Aspire Sports base case assumptions — April 2026
# Values traced to docs/superpowers/specs/2026-04-15-aspire-sports-financial-model-design.md §8
# Confidence levels: HIGH / MEDIUM / LOW-MEDIUM / LOW — see README for meaning.

start_month: "2026-07"       # Fall 2026 registration opens
horizon_months: 60            # 5 years monthly

pricing:
  # Soccer — premium/developmental positioning, ~20-25% above i9 rec baseline
  soccer_price: { low: 195, base: 215, high: 240 }
  soccer_weeks_per_season: 8
  soccer_seasons_per_year: 2
  soccer_roster_size: 12
  # Flag football — same premium positioning vs. NFL Flag rec
  flag_price: { low: 195, base: 215, high: 240 }
  flag_weeks_per_season: 7
  flag_seasons_per_year: 2
  flag_roster_size: 10
  # Winter indoor skills clinic — anchored to Resolute $20, Soccer Field Academy $40
  winter_skills_price_per_session: { low: 20, base: 25, high: 35 }
  winter_skills_group_size: 8
  winter_skills_sessions_per_week: 12
  family_discount_rate: 0.0
  sibling_discount_rate: 0.10
  uniform_fee: 0
  payment_processing_rate: 0.029
  payment_processing_flat: 0.30

demand:
  # Premium brand fills slower in Y1 — trust takes time. Compensated by higher retention/referral downstream.
  soccer_fill_rate: { low: 0.50, base: 0.65, high: 0.80 }
  flag_fill_rate: { low: 0.50, base: 0.65, high: 0.80 }
  winter_skills_fill_rate: { low: 0.60, base: 0.80, high: 0.95 }
  # Year 1 Fall 2026 target teams — conservative ramp
  target_teams_soccer_y1_fall:
    U8: 4
    U10: 3
    U12: 2
  target_teams_flag_y1_fall:
    K-2: 3
    3-4: 3
    5-6: 2
  season_growth_rate: { low: 0.10, base: 0.25, high: 0.50 }

retention:
  # Premium/developmental positioning: families self-select for commitment, kids progress,
  # retention materially higher than rec league comps. This is the model's core leverage.
  soccer_s1_to_s2: { low: 0.65, base: 0.80, high: 0.90 }
  soccer_s2_to_s3: { low: 0.82, base: 0.92, high: 0.96 }
  soccer_s3_plus: { low: 0.88, base: 0.94, high: 0.97 }
  flag_s1_to_s2: { low: 0.65, base: 0.80, high: 0.90 }
  flag_s2_to_s3: { low: 0.82, base: 0.92, high: 0.96 }
  flag_s3_plus: { low: 0.88, base: 0.94, high: 0.97 }
  winter_skills_retention: { low: 0.50, base: 0.65, high: 0.80 }
  cross_sell_rate: { low: 0.15, base: 0.25, high: 0.40 }
  # Word-of-mouth is the acquisition engine for premium programs. Moderated to
  # reflect realistic per-season compounding within a single territory; expansion
  # into new locations/sports/tiers is modeled separately (see Plan 2 roadmap).
  referral_multiplier: { low: 1.10, base: 1.20, high: 1.35 }

acquisition:
  channels_y1:
    partner_network: 0.35
    schools: 0.30
    micro_influencer: 0.15
    community_event: 0.10
    paid_digital: 0.10
  channels_y2:
    partner_network: 0.20
    schools: 0.25
    micro_influencer: 0.10
    community_event: 0.10
    paid_digital: 0.10
    referrals: 0.25
  channels_y3_plus:
    partner_network: 0.10
    schools: 0.20
    micro_influencer: 0.10
    community_event: 0.10
    paid_digital: 0.10
    referrals: 0.40
  cac_by_channel:
    partner_network: 5
    schools: 12
    micro_influencer: 5
    community_event: 20
    paid_digital: 50
    referrals: 5
  # Premium Y1 CAC is higher — evangelizing a new brand, not volume-buying. Drops hard as referrals kick in.
  blended_cac_y1: { low: 30, base: 40, high: 55 }
  blended_cac_y2: { low: 12, base: 18, high: 28 }
  blended_cac_y3_plus: { low: 6, base: 10, high: 16 }

costs:
  # Premium coaching rates — experienced club coaches, not entry-level rec refs.
  head_coach_hourly: { low: 28, base: 32, high: 40 }
  assistant_coach_hourly: { low: 18, base: 22, high: 28 }
  outdoor_field_hourly: { low: 25, base: 35, high: 60 }   # LOW CONFIDENCE — needs outreach
  indoor_turf_full_hourly: { low: 135, base: 175, high: 220 }
  indoor_turf_half_hourly: { low: 75, base: 95, high: 125 }
  gym_hourly: { low: 60, base: 70, high: 95 }
  software_monthly: 350
  # Corrected per i9 FDD: $3.11/player/yr participant + ~$600/yr general liability for small op
  insurance_monthly: 100
  bookkeeping_monthly: 250
  founder_time_annual_per_founder: 0
  num_founders: 2
  curriculum_dev_one_time: 30000
  curriculum_amortization_months: 36

capital:
  contribution_per_founder: 50000
  contribution_month: 1
  working_capital_reserve_floor: 15000
  distribution_policy: return_capital_then_split
  equity_split:
    founder_a: 0.50
    founder_b: 0.50
