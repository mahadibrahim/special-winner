[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-financial-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "numpy-financial>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["engine", "writers", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
