<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <!-- Aspire favicon — script "A" monogram with the signature blue dot.
         Stroke ink flips to white in dark mode (matches tab chrome);
         the brand blue dot (#2015B4) stays constant. -->
    <path class="stroke" d="M30 104 L74 24 L100 104" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path class="stroke" d="M45 74 L90 74" stroke-width="13" stroke-linecap="round"/>
    <circle cx="103" cy="33" r="11" fill="#2015B4"/>
    <style>
        .stroke { stroke: #1C1917; }
        @media (prefers-color-scheme: dark) {
            .stroke { stroke: #FFF; }
        }
    </style>
</svg>
